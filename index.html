<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pranav ajay</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #ffffff;
        color: #000000;
        font-family: monospace, sans-serif;
        font-size: 16px;
        line-height: normal;
        overflow-x: hidden;
      }

      pre {
        margin: 0;
        font-family: inherit;
        line-height: normal;
        white-space: pre;
        display: block;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .title {
        font-weight: bold;
        color: #000000;
      }

      .folder,
      .folder:visited {
        color: #0000ee;
      }

      a,
      a:visited {
        color: #008000;
        text-decoration: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(255, 255, 0, 0.5);
      }

      .folder:hover {
        background: #ffff00;
        text-decoration: underline;
        text-decoration-color: #0000ee;
        text-underline-offset: 2px;
      }

      a:hover,
      a:focus-visible {
        background: #ffff00;
        text-decoration: underline;
        text-decoration-color: #008000;
        text-underline-offset: 2px;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px;
          font-size: 13px;
        }

        pre {
          white-space: pre-wrap;
          overflow-wrap: anywhere;
          word-break: break-word;
          overflow-x: visible;
        }
      }

      @media (max-width: 390px) {
        body {
          padding: 10px;
          font-size: 12px;
        }
      }

      @media (max-width: 375px) {
        body {
          padding: 8px;
          font-size: 11px;
        }
      }

      @media (max-width: 320px) {
        body {
          padding: 6px;
          font-size: 10px;
        }
      }

      #guestbook-canvas-app {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: #ffffff;
        z-index: 50;
      }

      #guestbook-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #ffffff;
        cursor: text;
        touch-action: none;
      }

      #guestbook-canvas.dragging {
        cursor: grabbing;
      }

      #guestbook-toolbar {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 55;
        background: #ffffff;
        border: 1px solid #000000;
        color: #000000;
        padding: 4px 8px;
        font-family: monospace, sans-serif;
        font-size: 12px;
        line-height: 1.3;
      }

      #guestbook-day {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 55;
        background: #ffffff;
        color: #000000;
        padding: 4px 8px;
        font-family: monospace, sans-serif;
        font-size: 12px;
        line-height: 1.3;
      }

      #guestbook-toolbar a,
      #guestbook-toolbar a:visited {
        color: #0000ee;
      }

      #guestbook-toolbar a:hover,
      #guestbook-toolbar a:focus-visible {
        background: #ffff00;
      }
    </style>
  </head>
  <body>
    <pre><span class="title">pranav ajay</span>
└── <a href="#guestbook_app">free_text_editor.txt</a></pre>
    <script>
      (function () {
        var dataLinks = document.querySelectorAll('a[href^="data:text/html;base64,"]');
        var rootPre = document.querySelector("pre");
        var marker = "base64,";
        var guestbookHash = "#guestbook_app";
        var guestbookStorageKey = "guestbook_canvas_cells_v2";
        var guestbookSharedEndpoint =
          window.GUESTBOOK_SHARED_ENDPOINT || "";
        var guestbookStartPoint = { x: 0, y: 0 };
        var guestbookApp = null;
        var i;

        // One canvas per calendar day: every storage key is suffixed with ":YYYY-MM-DD".
        var legacyImagesKey = "free_text_images_v1";
        var legacyShapesKey = "free_text_shapes_v1";
        var pomoStorageKey = "free_text_pomo_v1";
        var dayPrefixes = [guestbookStorageKey, legacyImagesKey, legacyShapesKey];

        function pad2(n) {
          return (n < 10 ? "0" : "") + n;
        }

        function dayOf(date) {
          return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
        }

        function todayKey() {
          return dayOf(new Date());
        }

        function dayStorageKey(prefix, day) {
          return prefix + ":" + day;
        }

        function dayHash(day) {
          return day === todayKey() ? guestbookHash : guestbookHash + "=" + day;
        }

        function formatDay(day) {
          var parts = day.split("-");
          var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          var n = d.getDate();
          var suffix = n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th";

          return (
            ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][d.getDay()] + " " + n + suffix + " " +
            ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"][d.getMonth()] + " " +
            d.getFullYear()
          );
        }

        // Days that have anything saved, newest first (today is always included).
        function listDays() {
          var seen = {};
          var k;

          seen[todayKey()] = true;

          try {
            for (k = 0; k < localStorage.length; k += 1) {
              var name = localStorage.key(k);
              var m = /^(.*):(\d{4}-\d\d-\d\d)$/.exec(name || "");

              if (m && dayPrefixes.indexOf(m[1]) !== -1) {
                seen[m[2]] = true;
              }
            }
          } catch (e) {}

          return Object.keys(seen).sort().reverse();
        }

        // Old single-canvas data moves to the day it was last edited.
        function migrateLegacy() {
          var day = todayKey();
          var raw;
          var pomoRaw;

          try {
            raw = localStorage.getItem(guestbookStorageKey);

            if (raw) {
              var parsed = JSON.parse(raw);
              var newest = 0;

              if (parsed && parsed.cells && !Array.isArray(parsed.cells)) {
                Object.keys(parsed.cells).forEach(function (key) {
                  newest = Math.max(newest, safeTimestampOuter(parsed.cells[key] && parsed.cells[key].updatedAt));
                });
              }

              if (newest > 0) {
                day = dayOf(new Date(newest));
              }

              localStorage.setItem(dayStorageKey(guestbookStorageKey, day), raw);
              localStorage.removeItem(guestbookStorageKey);
            }

            [legacyImagesKey, legacyShapesKey].forEach(function (prefix) {
              var value = localStorage.getItem(prefix);

              if (value) {
                localStorage.setItem(dayStorageKey(prefix, day), value);
                localStorage.removeItem(prefix);
              }
            });

            pomoRaw = localStorage.getItem(pomoStorageKey);

            if (pomoRaw) {
              var saved = JSON.parse(pomoRaw);

              if (saved.timer && !saved.timer.d) {
                saved.timer.d = day;
              }

              (saved.log || []).forEach(function (e) {
                if (e && typeof e === "object" && !e.d) {
                  e.d = day;
                }
              });
              (saved.tags || []).forEach(function (g) {
                if (!g.d) {
                  g.d = day;
                }
              });
              localStorage.setItem(pomoStorageKey, JSON.stringify(saved));
            }
          } catch (e) {}
        }

        function safeTimestampOuter(value) {
          var n = Number(value);

          return isFinite(n) && n > 0 ? Math.floor(n) : 0;
        }

        function buildHomeHtml() {
          var days = listDays();
          var today = todayKey();
          var lines = ['<span class="title">pranav ajay</span>', "└── free_text_editor"];

          days.forEach(function (day, idx) {
            lines.push(
              "    " + (idx === days.length - 1 ? "└── " : "├── ") +
                '<a href="' + dayHash(day) + '">' + formatDay(day) + "</a>" + (day === today ? " (today)" : "") +
                ' <a href="#" data-delete="' + day + '">[delete]</a>'
            );
          });

          return lines.join("\n");
        }

        function injectMobileFitStyles(htmlText) {
          var styleTag =
            '<style id="mobile-fit-style">' +
            '@media (max-width: 640px) {' +
            'html, body { max-width: 100%; overflow-x: hidden; }' +
            'body { margin: 0; padding: 12px; box-sizing: border-box; }' +
            'pre { white-space: pre-wrap !important; overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }' +
            'a { word-break: break-all; }' +
            '}' +
            '</style>';

          if (htmlText.indexOf('id="mobile-fit-style"') !== -1) {
            return htmlText;
          }

          if (/<\/head>/i.test(htmlText)) {
            return htmlText.replace(/<\/head>/i, styleTag + "</head>");
          }

          if (/<body[^>]*>/i.test(htmlText)) {
            return htmlText.replace(/<body([^>]*)>/i, '<body$1>' + styleTag);
          }

          return styleTag + htmlText;
        }

        function injectExternalLinkBehavior(htmlText) {
          var scriptTag =
            '<script id="external-link-target-script">' +
            '(function () {' +
            'var links = document.querySelectorAll(\'a[href^="http://"], a[href^="https://"]\');' +
            'var i;' +
            'for (i = 0; i < links.length; i += 1) {' +
            'links[i].setAttribute("target", "_blank");' +
            'links[i].setAttribute("rel", "noopener noreferrer");' +
            '}' +
            '})();' +
            '</scr' +
            'ipt>';

          if (htmlText.indexOf('id="external-link-target-script"') !== -1) {
            return htmlText;
          }

          if (/<\/body>/i.test(htmlText)) {
            return htmlText.replace(/<\/body>/i, scriptTag + "</body>");
          }

          if (/<\/html>/i.test(htmlText)) {
            return htmlText.replace(/<\/html>/i, scriptTag + "</html>");
          }

          return htmlText + scriptTag;
        }

        function base64ToBlobUrl(base64Value) {
          var binary = atob(base64Value);
          var length = binary.length;
          var bytes = new Uint8Array(length);
          var decodedHtml;
          var mobileReadyHtml;
          var j;

          for (j = 0; j < length; j += 1) {
            bytes[j] = binary.charCodeAt(j);
          }

          if (typeof TextDecoder === "function") {
            decodedHtml = new TextDecoder("utf-8").decode(bytes);
          } else {
            decodedHtml = binary;
          }

          mobileReadyHtml = injectMobileFitStyles(decodedHtml);
          mobileReadyHtml = injectExternalLinkBehavior(mobileReadyHtml);

          var blob = new Blob([mobileReadyHtml], {
            type: "text/html;charset=utf-8",
          });
          return URL.createObjectURL(blob);
        }

        function escapeHtml(value) {
          return value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function createGuestbookApp() {
          if (guestbookApp) {
            return guestbookApp;
          }

          var container = document.createElement("div");
          var toolbar = document.createElement("div");
          var canvas = document.createElement("canvas");
          var mobileInput = document.createElement("textarea");
          var ctx;
          var dpr = 1;
          var cellWidth = 10;
          var cellHeight = 20;
          var baseline = 2;
          var offsetX = 0;
          var offsetY = 0;
          var dragging = false;
          var moved = false;
          var lastDragX = 0;
          var lastDragY = 0;
          var activePointerId = null;
          var cursorX = guestbookStartPoint.x;
          var cursorY = guestbookStartPoint.y;
          var cursorActive = true;
          var frameId = 0;
          var localSaveTimer = 0;
          var remoteSaveTimer = 0;
          var remotePollTimer = 0;
          var remoteSyncInFlight = false;
          var remoteSyncQueued = false;
          var nextAllowedRemoteWriteAt = 0;
          var remoteMinWriteIntervalMs = 12000;
          var remotePollIntervalMs = 7000;
          var cellMap = new Map();
          var images = [];
          var shapes = [];
          var drawMode = null;
          var drawing = null;
          var currentDay = "";
          var dayNode = null;
          var pendingJump = null;
          var allTags = [];
          var versionMap = new Map();
          var cellCountNode = null;
          var syncStatusNode = null;

          function normalizeCellChar(value) {
            if (typeof value !== "string" || value.length === 0) {
              return " ";
            }

            return Array.from(value)[0];
          }

          function safeTimestamp(value) {
            var numberValue = Number(value);

            if (!isFinite(numberValue) || numberValue < 0) {
              return 0;
            }

            return Math.floor(numberValue);
          }

          // Build a stable key for a world-space character cell.
          function mapKey(worldX, worldY) {
            return String(worldX) + "," + String(worldY);
          }

          function parseWorldKey(key) {
            var comma;
            var worldX;
            var worldY;

            if (typeof key !== "string") {
              return null;
            }

            comma = key.indexOf(",");

            if (comma <= 0 || comma >= key.length - 1) {
              return null;
            }

            worldX = parseInt(key.slice(0, comma), 10);
            worldY = parseInt(key.slice(comma + 1), 10);

            if (!isFinite(worldX) || !isFinite(worldY)) {
              return null;
            }

            return {
              worldX: worldX,
              worldY: worldY,
              key: mapKey(worldX, worldY),
            };
          }

          function updateCellCount() {
            if (cellCountNode) {
              cellCountNode.textContent = String(cellMap.size);
            }
          }

          function setSyncStatus(text) {
            if (syncStatusNode) {
              syncStatusNode.textContent = text;
            }
          }

          // Remove a day's canvas and everything tied to it (tags, timer, session log).
          function deleteDay(day) {
            try {
              dayPrefixes.forEach(function (prefix) {
                localStorage.removeItem(dayStorageKey(prefix, day));
              });
            } catch (e) {}

            allTags = allTags.filter(function (g) { return g.d !== day; });
            pomo.log = pomo.log.filter(function (e) { return e.d !== day; });

            if (pomo.timer && pomo.timer.d === day) {
              pomo.timer = null;
            }

            pomoSave();
            pomoRender();

            if (currentDay === day) {
              currentDay = "";
              cellMap.clear();
              versionMap.clear();
              rangeCache.clear();
              images = [];
              shapes = [];
              tags = [];
            }
          }

          // Switch to another day's canvas (saves the current one first).
          function loadDay(day) {
            if (localSaveTimer) {
              window.clearTimeout(localSaveTimer);
              localSaveTimer = 0;
            }

            if (currentDay) {
              saveToStorage();
            }

            currentDay = day;
            cellMap.clear();
            versionMap.clear();
            rangeCache.clear();
            images = [];
            shapes = [];
            tags = allTags.filter(function (g) { return g.d === day; });
            drawMode = null;
            drawing = null;
            canvas.style.cursor = "";
            hidePicker();
            loadFromStorage();
            loadImages();
            loadShapes();
            updateCellCount();
            dayNode.textContent = formatDay(day);
            centerOnStartPoint();
          }

          function centerOnStartPoint() {
            cursorX = guestbookStartPoint.x;
            cursorY = guestbookStartPoint.y;
            cursorActive = true;
            offsetX = cursorX * cellWidth - canvas.clientWidth / 2;
            offsetY = cursorY * cellHeight - canvas.clientHeight / 2;
          }

          function buildLocalSnapshot() {
            var snapshot = { cells: {}, updatedAt: 0 };

            versionMap.forEach(function (timestamp, key) {
              var safeTime = safeTimestamp(timestamp);
              var currentValue = cellMap.has(key) ? cellMap.get(key) : " ";

              snapshot.cells[key] = {
                ch: normalizeCellChar(currentValue),
                updatedAt: safeTime,
              };

              if (safeTime > snapshot.updatedAt) {
                snapshot.updatedAt = safeTime;
              }
            });

            return snapshot;
          }

          function normalizeRemoteDocument(raw) {
            var output = { cells: {}, updatedAt: 0 };
            var key;

            if (!raw || typeof raw !== "object") {
              return output;
            }

            output.updatedAt = safeTimestamp(raw.updatedAt);

            if (!raw.cells || typeof raw.cells !== "object" || Array.isArray(raw.cells)) {
              return output;
            }

            for (key in raw.cells) {
              var parsedKey;
              var item;
              var ch;
              var updatedAt;

              if (!Object.prototype.hasOwnProperty.call(raw.cells, key)) {
                continue;
              }

              parsedKey = parseWorldKey(key);

              if (!parsedKey) {
                continue;
              }

              item = raw.cells[key];

              if (!item || typeof item !== "object") {
                continue;
              }

              ch = normalizeCellChar(item.ch);
              updatedAt = safeTimestamp(item.updatedAt);

              output.cells[parsedKey.key] = {
                ch: ch,
                updatedAt: updatedAt,
              };

              if (updatedAt > output.updatedAt) {
                output.updatedAt = updatedAt;
              }
            }

            return output;
          }

          function mergeSnapshots(remoteSnapshot, localSnapshot) {
            var merged = { cells: {}, updatedAt: 0 };
            var allKeys = {};
            var key;

            for (key in remoteSnapshot.cells) {
              if (Object.prototype.hasOwnProperty.call(remoteSnapshot.cells, key)) {
                allKeys[key] = true;
              }
            }

            for (key in localSnapshot.cells) {
              if (Object.prototype.hasOwnProperty.call(localSnapshot.cells, key)) {
                allKeys[key] = true;
              }
            }

            for (key in allKeys) {
              var remoteCell = remoteSnapshot.cells[key];
              var localCell = localSnapshot.cells[key];
              var chosen;
              var chosenTime;
              var remoteDocTime;

              if (!Object.prototype.hasOwnProperty.call(allKeys, key)) {
                continue;
              }

              if (remoteCell && localCell) {
                chosen =
                  safeTimestamp(localCell.updatedAt) >= safeTimestamp(remoteCell.updatedAt)
                    ? localCell
                    : remoteCell;
              } else if (!remoteCell && localCell) {
                remoteDocTime = safeTimestamp(remoteSnapshot.updatedAt);
                chosen =
                  remoteDocTime > safeTimestamp(localCell.updatedAt)
                    ? { ch: " ", updatedAt: remoteDocTime }
                    : localCell;
              } else {
                chosen = localCell || remoteCell;
              }

              if (!chosen) {
                continue;
              }

              chosenTime = safeTimestamp(chosen.updatedAt);

              merged.cells[key] = {
                ch: normalizeCellChar(chosen.ch),
                updatedAt: chosenTime,
              };

              if (chosenTime > merged.updatedAt) {
                merged.updatedAt = chosenTime;
              }
            }

            return merged;
          }

          function applySnapshot(snapshot) {
            var key;
            var remoteDocTime = safeTimestamp(snapshot.updatedAt);

            for (key in snapshot.cells) {
              var incoming;
              var incomingTime;
              var localTime;

              if (!Object.prototype.hasOwnProperty.call(snapshot.cells, key)) {
                continue;
              }

              incoming = snapshot.cells[key];
              incomingTime = safeTimestamp(incoming.updatedAt);
              localTime = safeTimestamp(versionMap.get(key));

              if (incomingTime < localTime) {
                continue;
              }

              versionMap.set(key, incomingTime);

              if (normalizeCellChar(incoming.ch) === " ") {
                cellMap.delete(key);
              } else {
                cellMap.set(key, normalizeCellChar(incoming.ch));
              }
            }

            if (remoteDocTime > 0) {
              versionMap.forEach(function (timestamp, localKey) {
                if (
                  !Object.prototype.hasOwnProperty.call(snapshot.cells, localKey) &&
                  safeTimestamp(timestamp) < remoteDocTime
                ) {
                  versionMap.set(localKey, remoteDocTime);
                  cellMap.delete(localKey);
                }
              });
            }

            updateCellCount();
          }

          // Write one character to the world map and schedule persistence.
          function setCell(worldX, worldY, value) {
            var key = mapKey(worldX, worldY);
            var normalized = normalizeCellChar(value);
            var previous = cellMap.has(key) ? cellMap.get(key) : " ";
            var now = Date.now();

            if (normalized === previous) {
              return;
            }

            if (normalized === " ") {
              cellMap.delete(key);
            } else {
              cellMap.set(key, normalized);
            }

            versionMap.set(key, now);
            updateCellCount();

            if (localSaveTimer) {
              window.clearTimeout(localSaveTimer);
            }

            localSaveTimer = window.setTimeout(function () {
              localSaveTimer = 0;
              saveToStorage();
            }, 300);

            scheduleRemoteSync(1800);
          }

          function loadLegacyArray(parsedArray) {
            var idx;

            if (!Array.isArray(parsedArray)) {
              return;
            }

            for (idx = 0; idx < parsedArray.length; idx += 1) {
              var item = parsedArray[idx];
              var parsedKey;

              if (!Array.isArray(item) || item.length < 2) {
                continue;
              }

              parsedKey = parseWorldKey(item[0]);

              if (!parsedKey || typeof item[1] !== "string") {
                continue;
              }

              if (item[1].length === 1 && item[1] !== " ") {
                cellMap.set(parsedKey.key, item[1]);
                versionMap.set(parsedKey.key, safeTimestamp(item[2]));
              }
            }

            updateCellCount();
          }

          // Persist all non-empty world cells to localStorage.
          function saveToStorage() {
            if (!currentDay) {
              return;
            }

            var snapshot = buildLocalSnapshot();

            try {
              localStorage.setItem(dayStorageKey(guestbookStorageKey, currentDay), JSON.stringify(snapshot));
            } catch (error) {
              // Ignore quota/storage errors.
            }
          }

          // Restore previously saved world cells from localStorage.
          function loadFromStorage() {
            var raw;
            var parsed;
            var idx;

            try {
              raw = localStorage.getItem(dayStorageKey(guestbookStorageKey, currentDay));
            } catch (error) {
              return;
            }

            if (!raw) {
              return;
            }

            try {
              parsed = JSON.parse(raw);
            } catch (error) {
              return;
            }

            if (Array.isArray(parsed)) {
              loadLegacyArray(parsed);
              return;
            }

            if (!parsed || typeof parsed !== "object") {
              return;
            }

            if (Array.isArray(parsed.cells)) {
              loadLegacyArray(parsed.cells);
              return;
            }

            if (!parsed.cells || typeof parsed.cells !== "object") {
              return;
            }

            for (idx = 0; idx < Object.keys(parsed.cells).length; idx += 1) {
              var key = Object.keys(parsed.cells)[idx];
              var parsedKey = parseWorldKey(key);
              var item = parsed.cells[key];
              var ch;
              var updatedAt;

              if (!parsedKey || !item || typeof item !== "object") {
                continue;
              }

              ch = normalizeCellChar(item.ch);
              updatedAt = safeTimestamp(item.updatedAt);
              versionMap.set(parsedKey.key, updatedAt);

              if (ch === " ") {
                cellMap.delete(parsedKey.key);
              } else {
                cellMap.set(parsedKey.key, ch);
              }
            }

            updateCellCount();
          }

          function remoteUrl() {
            return guestbookSharedEndpoint + (guestbookSharedEndpoint.indexOf("?") === -1 ? "?" : "&") + "day=" + currentDay;
          }

          async function fetchRemoteSnapshot() {
            var response;
            var payload;

            response = await fetch(remoteUrl(), {
              method: "GET",
              cache: "no-store",
            });

            if (!response.ok) {
              throw new Error("Remote read failed: " + response.status);
            }

            payload = await response.json();

            return {
              etag: response.headers.get("etag"),
              snapshot: normalizeRemoteDocument(payload),
            };
          }

          async function writeRemoteSnapshot(snapshot, etag) {
            var response;
            var headers = {
              "Content-Type": "application/json",
            };

            if (etag) {
              headers["If-Match"] = etag;
            }

            response = await fetch(remoteUrl(), {
              method: "PUT",
              headers: headers,
              body: JSON.stringify(snapshot),
            });

            if (response.status === 412) {
              var conflictError = new Error("Conflict");
              conflictError.code = 412;
              throw conflictError;
            }

            if (!response.ok) {
              throw new Error("Remote write failed: " + response.status);
            }
          }

          function scheduleRemoteSync(delay) {
            if (!guestbookSharedEndpoint) {
              return;
            }

            if (remoteSaveTimer) {
              window.clearTimeout(remoteSaveTimer);
            }

            remoteSaveTimer = window.setTimeout(function () {
              remoteSaveTimer = 0;
              syncRemote(false);
            }, Math.max(150, delay));
          }

          async function syncRemote(force) {
            var now = Date.now();
            var attempts = 0;
            var writeReadyAt;

            if (!guestbookSharedEndpoint) {
              setSyncStatus("local only");
              return;
            }

            if (remoteSyncInFlight) {
              remoteSyncQueued = true;
              return;
            }

            writeReadyAt = Math.max(0, nextAllowedRemoteWriteAt - now);

            if (!force && writeReadyAt > 0) {
              scheduleRemoteSync(writeReadyAt);
              return;
            }

            remoteSyncInFlight = true;
            setSyncStatus("syncing");

            while (attempts < 3) {
              var remoteState;
              var localSnapshot;
              var mergedSnapshot;

              attempts += 1;

              try {
                remoteState = await fetchRemoteSnapshot();
                localSnapshot = buildLocalSnapshot();
                mergedSnapshot = mergeSnapshots(remoteState.snapshot, localSnapshot);
                await writeRemoteSnapshot(mergedSnapshot, remoteState.etag);
                applySnapshot(mergedSnapshot);
                saveToStorage();
                setSyncStatus("synced");
                nextAllowedRemoteWriteAt = Date.now() + remoteMinWriteIntervalMs;
                remoteSyncInFlight = false;

                if (remoteSyncQueued) {
                  remoteSyncQueued = false;
                  scheduleRemoteSync(remoteMinWriteIntervalMs);
                }

                return;
              } catch (error) {
                if (!error || error.code !== 412) {
                  setSyncStatus("local only");
                  nextAllowedRemoteWriteAt = Date.now() + remoteMinWriteIntervalMs;
                  remoteSyncInFlight = false;

                  if (remoteSyncQueued) {
                    remoteSyncQueued = false;
                    scheduleRemoteSync(remoteMinWriteIntervalMs);
                  }

                  return;
                }
              }
            }

            setSyncStatus("sync conflict");
            remoteSyncInFlight = false;
            scheduleRemoteSync(remoteMinWriteIntervalMs);
          }

          async function pullRemoteSnapshot() {
            if (!guestbookSharedEndpoint) {
              return;
            }

            try {
              var remoteState = await fetchRemoteSnapshot();
              applySnapshot(remoteState.snapshot);
              saveToStorage();

              if (!remoteSyncInFlight) {
                setSyncStatus("synced");
              }
            } catch (error) {
              if (!remoteSyncInFlight) {
                setSyncStatus("local only");
              }
            }
          }

          function scheduleRemotePolling() {
            if (!guestbookSharedEndpoint || !guestbookApp || !guestbookApp.active) {
              return;
            }

            if (remotePollTimer) {
              window.clearTimeout(remotePollTimer);
            }

            remotePollTimer = window.setTimeout(function () {
              pullRemoteSnapshot().then(function () {
                scheduleRemotePolling();
              });
            }, remotePollIntervalMs);
          }

          // Convert a mouse position on screen into absolute world cell coordinates.
          // Markdown-ish: "# " / "## " rows render larger; **text** renders bold.
          var headingScale = [1, 1.3, 1.15];

          function cellAt(x, y) {
            return cellMap.has(mapKey(x, y)) ? cellMap.get(mapKey(x, y)) : " ";
          }

          // Heading marker: "#"/"##" + space, at the row's first cell or right after the timestamp.
          function headInfo(y) {
            var left = null;
            var suffix = "," + y;
            var level;
            var x;

            cellMap.forEach(function (value, key) {
              var wx;

              if (key.slice(-suffix.length) !== suffix) {
                return;
              }

              wx = parseInt(key, 10);

              if (left === null || wx < left) {
                left = wx;
              }
            });

            if (left === null) {
              return { k: 1, from: -1, to: -1 };
            }

            var starts = [left];
            var prefix = "";

            for (x = left; x < left + 16; x += 1) {
              prefix += cellAt(x, y);

              if (/^\d{1,2}(st|nd|rd|th) [a-z]{3} \d\d:\d\d $/.test(prefix)) {
                starts.push(x + 1);
              }
            }

            for (x = 0; x < starts.length; x += 1) {
              if (cellAt(starts[x], y) === "#") {
                level = cellAt(starts[x] + 1, y) === "#" ? 2 : 1;

                if (cellAt(starts[x] + level, y) === " " && cellAt(starts[x] + level + 1, y) !== " ") {
                  return { k: headingScale[level], from: starts[x], to: starts[x] + level - 1 };
                }
              }
            }

            return { k: 1, from: -1, to: -1 };
          }

          function rowScale(y) {
            return headInfo(y).k;
          }

          // Slash command: "/pomo [minutes] [task]" + Enter starts a timer; "/pomo stop" cancels it.
          var pomoKey = pomoStorageKey;
          var pomo = { timer: null, log: [] };
          var tags = [];
          var pomoNode = null;
          var pomoTick = 0;

          function pomoSave() {
            try {
              localStorage.setItem(pomoKey, JSON.stringify({ timer: pomo.timer, log: pomo.log, tags: allTags }));
            } catch (e) {}
          }

          function pomoLoad() {
            try {
              var saved = JSON.parse(localStorage.getItem(pomoKey) || "{}");

              pomo.timer = saved.timer || null;
              pomo.log = (Array.isArray(saved.log) ? saved.log : []).map(function (e) {
                return typeof e === "number" ? { t: e, task: "", min: 25, ok: true, x: 0, y: 0, d: todayKey() } : e;
              });
              allTags = Array.isArray(saved.tags) ? saved.tags : [];
            } catch (e) {}
          }

          function pomoToday() {
            var start = new Date();

            start.setHours(0, 0, 0, 0);

            return pomo.log.filter(function (e) { return e.ok && e.t >= start.getTime(); }).length;
          }

          function writeAt(x, y, text) {
            Array.from(text).forEach(function (ch) {
              setCell(x, y, ch);
              x += ch.length > 1 ? 2 : 1;
            });
          }

          function pomoBeep() {
            try {
              var ac = new (window.AudioContext || window.webkitAudioContext)();
              var osc = ac.createOscillator();

              osc.frequency.value = 660;
              osc.connect(ac.destination);
              osc.start();
              osc.stop(ac.currentTime + 0.25);
            } catch (e) {}
          }

          function pomoRender() {
            var t = pomo.timer;
            var left;
            var mm;
            var ss;

            if (!pomoNode) {
              return;
            }

            if (!t) {
              pomoNode.textContent = pomoToday() ? "\u{1F345}\u00d7" + pomoToday() : "type /pomo";
              if (guestbookApp && guestbookApp.active) {
                document.title = "free text editor";
              }

              return;
            }

            left = Math.max(0, Math.round((t.end - Date.now()) / 1000));
            mm = Math.floor(left / 60);
            ss = left % 60;
            pomoNode.textContent =
              "\u{1F345} " + (mm < 10 ? "0" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss + (t.task ? " " + t.task : "");
            if (guestbookApp && guestbookApp.active) {
              document.title = (mm < 10 ? "0" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss + " \u{1F345}";
            }
          }

          function setCellOnOtherDay(day, x, y, ch) {
            var key = dayStorageKey(guestbookStorageKey, day);

            try {
              var snap = JSON.parse(localStorage.getItem(key) || "{}");

              if (snap && snap.cells && !Array.isArray(snap.cells)) {
                snap.cells[mapKey(x, y)] = { ch: ch, updatedAt: Date.now() };
                localStorage.setItem(key, JSON.stringify(snap));
              }
            } catch (e) {}
          }

          function pomoFinish(ok) {
            var t = pomo.timer;

            if (!t) {
              return;
            }

            if (!t.d || t.d === currentDay) {
              setCell(t.x, t.y, ok ? "\u2705" : "\u23F9");
            } else {
              setCellOnOtherDay(t.d, t.x, t.y, ok ? "\u2705" : "\u23F9");
            }

            pomo.timer = null;

            pomo.log.push({ t: Date.now(), task: t.task, min: t.min, ok: ok, x: t.x, y: t.y, d: t.d || currentDay });

            if (ok) {
              pomoBeep();
            }

            pomoSave();
            pomoRender();
          }

          function pomoLoop() {
            window.clearInterval(pomoTick);
            pomoTick = window.setInterval(function () {
              if (pomo.timer && Date.now() >= pomo.timer.end) {
                pomoFinish(true);
              }

              pomoRender();
            }, 1000);
          }

          // A tag runs from its "/tag name" line until "/end"; while open it covers the block below it.
          var rangeCache = new Map();

          function tagRange(g) {
            var box;

            if (g.open) {
              var hit = rangeCache.get(g);

              if (hit && Date.now() - hit.at < 400) {
                return hit.r;
              }

              box = clusterAround(g.x0, g.y0);
              hit = { at: Date.now(), r: { y0: g.y0, y1: box ? box.y1 : g.y0 } };
              rangeCache.set(g, hit);

              return hit.r;
            }

            return { y0: g.y0, y1: g.y1 };
          }

          // Group of notes around (x, y): cells within 4 columns / 1 row of each other.
          function clusterAround(x, y) {
            var seen = {};
            var queue = [[x, y]];
            var box = null;
            var dx;
            var dy;

            while (queue.length) {
              var cur = queue.pop();
              var k = mapKey(cur[0], cur[1]);

              if (seen[k] || !cellMap.has(k)) {
                continue;
              }

              seen[k] = true;
              box = box
                ? { x0: Math.min(box.x0, cur[0]), y0: Math.min(box.y0, cur[1]), x1: Math.max(box.x1, cur[0]), y1: Math.max(box.y1, cur[1]) }
                : { x0: cur[0], y0: cur[1], x1: cur[0], y1: cur[1] };

              for (dy = -1; dy <= 1; dy += 1) {
                for (dx = -4; dx <= 4; dx += 1) {
                  if (!seen[mapKey(cur[0] + dx, cur[1] + dy)]) {
                    queue.push([cur[0] + dx, cur[1] + dy]);
                  }
                }
              }
            }

            return box;
          }

          function jumpTo(x, y) {
            cursorX = x;
            cursorY = y;
            cursorActive = true;
            offsetX = x * cellWidth - canvas.clientWidth / 2 + 120;
            offsetY = y * cellHeight - canvas.clientHeight / 2;
          }

          function rowText(y, x0, x1) {
            var t = "";
            var x;

            for (x = x0; x <= x1; x += 1) {
              t += cellAt(x, y);
            }

            return t;
          }

          // "/pomo ...", "/tag ..." typed on a line: rewrite it in place. Returns true if handled.
          function runCommand(y) {
            var left = null;
            var right = null;
            var m;
            var x;

            cellMap.forEach(function (value, key) {
              var comma = key.indexOf(",");
              var wx = parseInt(key, 10);

              if (parseInt(key.slice(comma + 1), 10) !== y) {
                return;
              }

              left = left === null ? wx : Math.min(left, wx);
              right = right === null ? wx : Math.max(right, wx);
            });

            if (left === null) {
              return false;
            }

            var text = rowText(y, left, right);

            m = /(^|\s)\/(pomo|tag|end|box|circle|line|arrow)(?:\s+(.*))?$/.exec(text);

            if (!m) {
              return false;
            }

            var slashX = left + m.index + m[1].length;
            var arg = (m[3] || "").trim();

            for (x = slashX; x <= right + 1; x += 1) {
              setCell(x, y, "");
            }

            if (/^(box|circle|line|arrow)$/.test(m[2])) {
              startDrawMode(m[2]);
              return true;
            }

            if (m[2] === "tag") {
              var name = arg.replace(/^#/, "").replace(/\s+/g, "_");

              if (!name) {
                openFinder(
                  tags.map(function (g) {
                    return { label: "#" + g.name, hint: g.open ? "open" : "", x: g.x0, y: g.y0, tag: g };
                  }),
                  "tags"
                );
                return true;
              }

              writeAt(slashX, y, "#" + name);
              var created = { name: name, x0: slashX, y0: y, y1: y, open: true, d: currentDay };

              tags.push(created);
              allTags.push(created);
              pomoSave();

              return true;
            }

            if (m[2] === "end") {
              var openTag = null;

              tags.forEach(function (g) {
                if (g.open && g.y0 <= y && (!openTag || g.y0 > openTag.y0)) {
                  openTag = g;
                }
              });

              if (openTag) {
                openTag.open = false;
                openTag.y1 = Math.max(openTag.y0, y - 1);
                writeAt(slashX, y, "/" + openTag.name);
                pomoSave();
              }

              return true;
            }

            if (arg === "list") {
              openFinder(
                pomo.log.slice().reverse().map(function (e) {
                  var d = new Date(e.t);

                  return {
                    label: (e.ok ? "\u2705 " : "\u23F9 ") + (e.task || "pomodoro"),
                    hint: e.min + "m " + dateLabel(d) + " " + timeLabel(d),
                    x: e.x,
                    y: e.y,
                    day: e.d,
                  };
                }),
                "sessions"
              );
              return true;
            }

            var minutes = 25;
            var num = /^(\d{1,3})(?:\s+|$)/.exec(arg);

            if (arg === "stop") {
              pomoFinish(false);
              return true;
            }

            if (num) {
              minutes = Math.max(1, parseInt(num[1], 10));
              arg = arg.slice(num[0].length);
            }

            pomoFinish(false);
            pomo.timer = { end: Date.now() + minutes * 60000, min: minutes, task: arg, x: slashX, y: y, d: currentDay };
            writeAt(slashX, y, "\u{1F345} " + arg);
            pomoSave();
            pomoLoop();
            pomoRender();

            return true;
          }

          // Rofi-style finder: Cmd/Ctrl+K searches all text; also used for /tag and /pomo list.
          var finder = { node: null, input: null, list: null, items: [], shown: [], sel: 0 };

          function closeFinder() {
            if (finder.node) {
              finder.node.style.display = "none";
            }

            canvas.focus();
          }

          function finderRender() {
            var q = finder.input.value.toLowerCase().trim();

            finder.shown = finder.items
              .filter(function (it) { return !q || (it.label + " " + it.hint).toLowerCase().indexOf(q) !== -1; })
              .slice(0, 8);
            finder.sel = Math.min(finder.sel, Math.max(0, finder.shown.length - 1));
            finder.list.innerHTML = "";
            finder.shown.forEach(function (it, i) {
              var row = document.createElement("div");
              var label = it.label.length > 60 ? it.label.slice(0, 59) + "\u2026" : it.label;

              row.textContent = label + (it.hint ? "   " + it.hint : "");
              row.style.cssText =
                "padding:2px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" +
                (i === finder.sel ? "background:#ffff00;" : "");
              row.addEventListener("pointerdown", function (e) {
                e.preventDefault();
                finder.sel = i;
                finderPick();
              });
              finder.list.appendChild(row);
            });

            if (finder.shown.length === 0) {
              finder.list.textContent = "nothing found";
              finder.list.style.color = "#888";
            } else {
              finder.list.style.color = "#000";
            }
          }

          function finderPick() {
            var it = finder.shown[finder.sel];

            if (it && it.tag) {
              var r = tagRange(it.tag);
              var notes = searchItems(r.y0 + 1, r.y1, it.tag.x0 - 4).filter(function (n) { return !n.tag; });

              finder.items = [{ label: "\u2192 #" + it.tag.name, hint: "go to tag", x: it.x, y: it.y }].concat(notes);
              finder.sel = 0;
              finder.input.value = "";
              finder.input.placeholder = "#" + it.tag.name;
              finderRender();
              return;
            }

            closeFinder();

            if (it && it.day && it.day !== currentDay) {
              pendingJump = { x: it.x, y: it.y };
              window.location.hash = dayHash(it.day);
            } else if (it) {
              jumpTo(it.x, it.y);
            }
          }

          function openFinder(items, mode) {
            if (!finder.node) {
              finder.node = document.createElement("div");
              finder.input = document.createElement("input");
              finder.list = document.createElement("div");
              finder.node.style.cssText =
                "position:fixed;top:18%;left:50%;transform:translateX(-50%);width:min(560px,90vw);z-index:70;" +
                "background:#fff;border:1px solid #000;font:14px/1.6 monospace;";
              finder.input.style.cssText =
                "width:100%;box-sizing:border-box;border:0;border-bottom:1px solid #000;outline:0;" +
                "padding:6px 12px;font:inherit;background:#fff;color:#000;";
              finder.input.setAttribute("spellcheck", "false");
              finder.input.addEventListener("input", function () {
                finder.sel = 0;
                finderRender();
              });
              finder.input.addEventListener("keydown", function (e) {
                e.stopPropagation();

                if (e.key === "Escape") {
                  e.preventDefault();
                  closeFinder();
                } else if (e.key === "Enter") {

              finder.node.appendChild(finder.list);
              document.body.appendChild(finder.node);

            finder.items = items;
            finder.sel = 0;
            finder.input.value = "";
            finder.input.placeholder = mode === "search" ? "search" : mode;
            finder.node.style.display = "block";
            finderRender();
            finder.input.focus();
          }

          function searchItems(fromY, toY, minX) {
            var rows = {};
            var items = (fromY === undefined ? tags : []).map(function (g) {
              return { label: "#" + g.name, hint: "tag", x: g.x0, y: g.y0, tag: g };
            });

            cellMap.forEach(function (value, key) {
              var comma = key.indexOf(",");
              var wy = parseInt(key.slice(comma + 1), 10);
              var wx = parseInt(key, 10);

              if (fromY !== undefined && (wy < fromY || wy > toY || wx < minX)) {
                return;
              }

              (rows[wy] = rows[wy] || []).push([wx, value]);
            });

            Object.keys(rows).sort(function (a, b) { return a - b; }).forEach(function (rowKey) {
              var cells = rows[rowKey].sort(function (a, b) { return a[0] - b[0]; });
              var text = "";
              var start = null;
              var last = null;

              function flush() {
                if (text.trim()) {
                  items.push({ label: text.trim(), hint: "", x: start, y: parseInt(rowKey, 10) });
                }

                text = "";
                start = null;
              }

              cells.forEach(function (c) {
                if (last !== null && c[0] - last > 3) {
                  flush();
                }

                if (start === null) {
                  start = c[0];
                }

                text += (last !== null && c[0] - last > 1 && text ? " " : "") + c[1];
                last = c[0];
              });
              flush();
            });

            return items;
          }

          // Emoji picker: typing ":" opens it; keep typing to filter.
          var emojis = {
            smile: "😀", grin: "😁", joy: "😂", wink: "😉", blush: "😊", heart_eyes: "😍", cool: "😎",
            thinking: "🤔", cry: "😢", sob: "😭", angry: "😠", sleepy: "😴", scream: "😱", party: "🥳",
            heart: "❤️", broken_heart: "💔", fire: "🔥", star: "⭐", sparkles: "✨", sun: "☀️", moon: "🌙",
            cloud: "☁️", rain: "🌧️", snow: "❄️", tree: "🌳", flower: "🌸", leaf: "🍃", cat: "🐱", dog: "🐶",
            thumbsup: "👍", thumbsdown: "👎", clap: "👏", wave: "👋", pray: "🙏", muscle: "💪", eyes: "👀",
            ok: "👌", peace: "✌️", coffee: "☕", pizza: "🍕", cake: "🎂", music: "🎵", book: "📖",
            camera: "📷", film: "🎬", rocket: "🚀", check: "✅", x: "❌", warning: "⚠️", bulb: "💡", "100": "💯"
          };
          var picker = { colonX: 0, matches: [], sel: 0, dismissed: false };
          var pickerNode = document.createElement("div");

          pickerNode.style.cssText =
            "position:fixed;display:none;z-index:60;background:#fff;border:1px solid #000;" +
            "font:12px/1.5 monospace;padding:2px 0;min-width:120px;";

          function hidePicker() {
            picker.matches = [];
            pickerNode.style.display = "none";
          }

          function renderPicker() {
            var rect = canvas.getBoundingClientRect();
            var k = rowScale(cursorY);

            if (picker.matches.length === 0) {
              hidePicker();
              return;
            }

            pickerNode.innerHTML = "";
            picker.matches.forEach(function (name, i) {
              var row = document.createElement("div");

              row.textContent = emojis[name] + "  " + name;
              row.style.cssText = "padding:0 8px;cursor:pointer;" + (i === picker.sel ? "background:#ffff00;" : "");
              row.addEventListener("pointerdown", function (e) {
                e.preventDefault();
                picker.sel = i;
                pickEmoji();
              });
              pickerNode.appendChild(row);
            });
            pickerNode.style.left = Math.max(0, rect.left + cursorX * cellWidth * k - offsetX) + "px";
            pickerNode.style.top = rect.top + (cursorY + 1) * cellHeight - offsetY + 2 + "px";
            pickerNode.style.display = "block";
          }

          function updatePicker() {
            var x = cursorX;
            var q = "";
            var c;

            hidePicker();

            while (x > guestbookStartPoint.x && q.length < 12) {
              c = cellAt(x - 1, cursorY);

              if (/^[a-z0-9_]$/i.test(c)) {
                q = c + q;
                x -= 1;
              } else {
                break;
              }
            }

            if (x <= guestbookStartPoint.x || cellAt(x - 1, cursorY) !== ":") {
              picker.dismissed = false;
              return;
            }

            if (x - 1 > guestbookStartPoint.x && /^[a-z0-9_]$/i.test(cellAt(x - 2, cursorY))) {
              return;
            }

            if (picker.dismissed) {
              return;
            }

            picker.colonX = x - 1;
            q = q.toLowerCase();
            picker.matches = Object.keys(emojis)
              .filter(function (n) { return n.indexOf(q) === 0; })
              .concat(Object.keys(emojis).filter(function (n) { return q && n.indexOf(q) > 0; }))
              .slice(0, 6);
            picker.sel = 0;
            renderPicker();
          }

          // Typing a full ":name:" turns it into the emoji.
          function finishShortcode() {
            var x = cursorX;
            var q = "";

            while (x > guestbookStartPoint.x && /^[a-z0-9_]$/i.test(cellAt(x - 1, cursorY))) {
              q = cellAt(x - 1, cursorY) + q;
              x -= 1;
            }

            if (!q || cellAt(x - 1, cursorY) !== ":" || !emojis[q.toLowerCase()]) {
              return false;
            }

            picker.colonX = x - 1;
            picker.matches = [q.toLowerCase()];
            picker.sel = 0;
            pickEmoji();
            return true;
          }

          function pickEmoji() {
            var x;
            var emoji = emojis[picker.matches[picker.sel]];

            if (!emoji) {
              return;
            }

            for (x = picker.colonX; x < cursorX; x += 1) {
              setCell(x, cursorY, "");
            }

            cursorX = picker.colonX;
            setCell(cursorX, cursorY, emoji);
            cursorX += 2;
            hidePicker();
          }

          function clientToWorld(clientX, clientY) {
            var rect = canvas.getBoundingClientRect();
            var screenX = clientX - rect.left;
            var screenY = clientY - rect.top;

            var wy = Math.floor((screenY + offsetY) / cellHeight);

            return {
              worldX: Math.floor((screenX + offsetX) / (cellWidth * rowScale(wy))),
              worldY: wy,
            };
          }

          // Pasted images: downscaled, kept in localStorage, drawn at their cell.
          function saveImages() {
            try {
              localStorage.setItem(
                dayStorageKey(legacyImagesKey, currentDay),
                JSON.stringify(images.map(function (it) { return { x: it.x, y: it.y, src: it.src }; }))
              );
            } catch (e) {}
          }

          function addImage(x, y, src, persist) {
            var img = new Image();
            var item = { x: x, y: y, src: src, img: img };

            img.onload = function () { item.ready = true; };
            img.src = src;
            images.push(item);

            if (persist) {
              saveImages();
            }
          }

          function loadImages() {
            try {
              JSON.parse(localStorage.getItem(dayStorageKey(legacyImagesKey, currentDay)) || "[]").forEach(function (it) {
                addImage(it.x, it.y, it.src, false);
              });
            } catch (e) {}
          }

          // Shapes: "/box", "/circle", "/line", "/arrow" then drag on the canvas.
          function saveShapes() {
            try {
              localStorage.setItem(dayStorageKey(legacyShapesKey, currentDay), JSON.stringify(shapes));
            } catch (e) {}
          }

          function loadShapes() {
            try {
              shapes = JSON.parse(localStorage.getItem(dayStorageKey(legacyShapesKey, currentDay)) || "[]");
            } catch (e) {}
          }

          function startDrawMode(kind) {
            drawMode = kind;
            canvas.style.cursor = "crosshair";
            setSyncStatus("drag to draw " + kind + " (esc cancels)");
          }

          function endDrawMode() {
            drawMode = null;
            drawing = null;
            canvas.style.cursor = "";
            setSyncStatus(guestbookSharedEndpoint ? "synced" : "local only");
          }

          function drawShape(sh, color) {
            var x0 = Math.min(sh.x0, sh.x1) * cellWidth - offsetX;
            var y0 = Math.min(sh.y0, sh.y1) * cellHeight - offsetY;
            var w = (Math.abs(sh.x1 - sh.x0) + 1) * cellWidth;
            var h = (Math.abs(sh.y1 - sh.y0) + 1) * cellHeight;
            var ax = (sh.x0 + 0.5) * cellWidth - offsetX;
            var ay = (sh.y0 + 0.5) * cellHeight - offsetY;
            var bx = (sh.x1 + 0.5) * cellWidth - offsetX;
            var by = (sh.y1 + 0.5) * cellHeight - offsetY;

            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();

            if (sh.t === "box") {
              ctx.rect(x0, y0, w, h);
            } else if (sh.t === "circle") {
              ctx.ellipse(x0 + w / 2, y0 + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
            } else {
              ctx.moveTo(ax, ay);
              ctx.lineTo(bx, by);

              if (sh.t === "arrow") {
                var ang = Math.atan2(by - ay, bx - ax);

                ctx.moveTo(bx, by);
                ctx.lineTo(bx - 10 * Math.cos(ang - 0.45), by - 10 * Math.sin(ang - 0.45));
                ctx.moveTo(bx, by);
                ctx.lineTo(bx - 10 * Math.cos(ang + 0.45), by - 10 * Math.sin(ang + 0.45));
              }
            }

            ctx.stroke();
          }

          function removeImageAtCursor() {
            var before = images.length;

            var beforeShapes = shapes.length;

            images = images.filter(function (it) { return it.x !== cursorX || it.y !== cursorY; });
            shapes = shapes.filter(function (sh) {
              return Math.min(sh.x0, sh.x1) !== cursorX || Math.min(sh.y0, sh.y1) !== cursorY;
            });

            if (shapes.length !== beforeShapes) {
              saveShapes();
            }

            if (images.length !== before) {
              saveImages();
            }

            return images.length !== before || shapes.length !== beforeShapes;
          }

          function onPaste(event) {
            var items = (event.clipboardData && event.clipboardData.items) || [];
            var k;

            if (!guestbookApp || !guestbookApp.active) {
              return;
            }

            for (k = 0; k < items.length; k += 1) {
              if (items[k].type.indexOf("image/") === 0) {
                var file = items[k].getAsFile();
                var reader = new FileReader();
                var px = cursorX;
                var py = cursorY;

                event.preventDefault();
                reader.onload = function () {
                  var src = new Image();

                  src.onload = function () {
                    var scale = Math.min(1, 360 / src.width);
                    var c = document.createElement("canvas");

                    c.width = Math.max(1, Math.round(src.width * scale));
                    c.height = Math.max(1, Math.round(src.height * scale));
                    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
                    addImage(px, py, c.toDataURL("image/jpeg", 0.85), true);
                  };
                  src.src = reader.result;
                };
                reader.readAsDataURL(file);
                return;
              }
            }
          }

            cursorX += dx;
            cursorY += dy;

            }

          // Used by "/pomo list" hints.
          function dateLabel(d) {
            var day = d.getDate();
            var suffix = day % 10 === 1 && day !== 11 ? "st" : day % 10 === 2 && day !== 12 ? "nd" : day % 10 === 3 && day !== 13 ? "rd" : "th";

            return day + suffix + " " + ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"][d.getMonth()];
          }

          function timeLabel(d) {
            return (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
          }

          function insertTextAtCursor(text) {
            var idx;

            if (!cursorActive) {
              return;
            }

            var chars = Array.from(text);

            for (idx = 0; idx < chars.length; idx += 1) {
              var ch = chars[idx];

              if (ch === "\r") {
                continue;
              }

              if (ch === "\n") {
                cursorX = guestbookStartPoint.x;
                cursorY += 1;
                continue;

            activePointerId = event.pointerId;

            lastDragY = event.clientY;

            dy = event.clientY - lastDragY;

            offsetY -= dy;

            lastDragY = event.clientY;

              return;
            }

            activePointerId = null;

              cursorY = hit.worldY;

          }

              event.preventDefault();
              endDrawMode();
              return;
            }

            if (picker.matches.length > 0) {
              if (event.key === "Enter" || event.key === "Tab") {
                event.preventDefault();
                pickEmoji();
                return;
              }

              if (event.key === "Escape") {
                event.preventDefault();
                picker.dismissed = true;
                hidePicker();
                return;
              }

              if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                event.preventDefault();
                picker.sel = (picker.sel + (event.key === "ArrowDown" ? 1 : picker.matches.length - 1)) % picker.matches.length;

                return;
              }

            if ((event.key === "Backspace" || event.key === "Delete") && removeImageAtCursor()) {
              event.preventDefault();
              return;
            }

            if (event.key === "Backspace") {
              event.preventDefault();
              moveCursor(-1, 0);
              setCell(cursorX, cursorY, "");
              updatePicker();
              return;
            }

            if (event.key === "Delete") {
              event.preventDefault();
              setCell(cursorX, cursorY, "");
              return;
            }

            if (event.key === "Enter") {
              event.preventDefault();
              runCommand(cursorY);
              cursorX = guestbookStartPoint.x;
              cursorY += 1;
              hidePicker();
              return;
            }

            if (event.key === "ArrowLeft") {
              event.preventDefault();
              moveCursor(-1, 0);
              return;
            }

            if (event.key === "ArrowRight") {
              event.preventDefault();
              moveCursor(1, 0);
              return;
            }

            if (event.key === "ArrowUp") {
              event.preventDefault();
              moveCursor(0, -1);
              return;
            }

            if (event.key === "ArrowDown") {
              event.preventDefault();
              moveCursor(0, 1);
              return;
            }

            if (event.key === "Tab") {
              event.preventDefault();
              moveCursor(2, 0);
              return;
            }

            if (event.key.length === 1 && !event.altKey) {
              event.preventDefault();
              insertTextAtCursor(event.key);
            }
          }

          function onMobileInput() {
            var value = mobileInput.value;

            if (!value) {
              return;
            }

            insertTextAtCursor(value);
            mobileInput.value = "";
          }

          // Keep the canvas resolution in sync with window size and device pixel ratio.
          function resizeCanvas() {
            var rect;
            var m;

            dpr = window.devicePixelRatio || 1;
            rect = canvas.getBoundingClientRect();
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.font = "16px monospace";
            ctx.textBaseline = "top";

            m = ctx.measureText("M");
            cellWidth = Math.max(8, Math.ceil(m.width));
            cellHeight = 20;
            baseline = 2;
          }

          // Render loop: clear, draw only visible cells, then draw blinking cursor.
          function render() {
            var width = canvas.clientWidth;
            var height = canvas.clientHeight;
            var minX = Math.floor(offsetX / cellWidth) - 1;
            var maxX = Math.floor((offsetX + width) / cellWidth) + 1;
            var minY = Math.floor(offsetY / cellHeight) - 1;
            var maxY = Math.floor((offsetY + height) / cellHeight) + 1;
            var now = Date.now();

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#000000";

            images.forEach(function (it) {
              if (it.ready) {
                ctx.drawImage(it.img, it.x * cellWidth - offsetX, it.y * cellHeight - offsetY);
              }
            });

            shapes.forEach(function (sh) { drawShape(sh, "#000000"); });

            if (drawing) {
              drawShape(drawing, "#888888");
            }

            var rows = {};

            cellMap.forEach(function (value, key) {
              var comma = key.indexOf(",");
              var worldX = parseInt(key.slice(0, comma), 10);
              var worldY = parseInt(key.slice(comma + 1), 10);

              if (comma <= 0 || !isFinite(worldX) || !isFinite(worldY)) {
                return;
              }

              if (worldY < minY || worldY > maxY) {
                return;
              }

              (rows[worldY] = rows[worldY] || []).push([worldX, value]);
            });

            Object.keys(rows).forEach(function (rowKey) {
              var y = parseInt(rowKey, 10);
              var cells = rows[rowKey].sort(function (a, b) { return a[0] - b[0]; });
              var head = headInfo(y);
              var k = head.k;
              var bold = false;
              var n;

              for (n = 0; n < cells.length; n += 1) {
                var x = cells[n][0];
                var ch = cells[n][1];
                var next = cells[n + 1];
                var marker = false;

                if (ch === "*" && next && next[0] === x + 1 && next[1] === "*") {
                  if (bold || cells.slice(n + 2).some(function (c, i, a) {
                    return c[1] === "*" && a[i + 1] && a[i + 1][0] === c[0] + 1 && a[i + 1][1] === "*";
                  })) {
                    marker = true;
                  }
                }

                var isHash = k > 1 && x >= head.from && x <= head.to;
                var drawX = x * cellWidth * k - offsetX;
                var drawY = y * cellHeight - offsetY;

                if (x * k < minX - 1 || x * k > maxX) {
                  continue;
                }

                if (marker) {
                  ctx.fillStyle = "#bbbbbb";
                  ctx.font = "bold 16px monospace";
                  ctx.fillText("*", drawX, drawY + baseline);
                  ctx.fillText("*", drawX + cellWidth * k, drawY + baseline);
                  bold = !bold;
                  n += 1;
                  continue;
                }

                ctx.fillStyle = isHash ? "#bbbbbb" : "#000000";
                ctx.font = (k > 1 ? "bold " + Math.round(16 * k) : bold ? "bold 16" : "16") + "px monospace";
                ctx.fillText(ch, drawX, drawY + baseline - (k > 1 ? 1 : 0));
              }
            });

            tags.forEach(function (g) {
              ctx.fillStyle = "#e4e4e4";
              var r = tagRange(g);

              ctx.fillRect(g.x0 * cellWidth - offsetX - 5, r.y0 * cellHeight - offsetY, 2, (r.y1 - r.y0 + 1) * cellHeight);
            });

            if (pomo.timer && (!pomo.timer.d || pomo.timer.d === currentDay) && rows[pomo.timer.y]) {
              var endX = 0;
              var left = Math.max(0, Math.round((pomo.timer.end - now) / 1000));

              rows[pomo.timer.y].forEach(function (c) { endX = Math.max(endX, c[0]); });
              ctx.fillStyle = "#888888";
              ctx.font = "16px monospace";
              ctx.fillText(
                Math.floor(left / 60) + ":" + (left % 60 < 10 ? "0" : "") + (left % 60),

            }

            ctx.fillStyle = "#000000";
            ctx.font = "16px monospace";

            } else {

            }
          }

          container.id = "guestbook-canvas-app";

          toolbar.id = "guestbook-toolbar";
          toolbar.innerHTML =

            " | " +
            "<span id=\"guestbook-sync-status\">starting</span>" +

          mobileInput.style.height = "1px";

          container.appendChild(dayNode);
          container.appendChild(canvas);
          container.appendChild(mobileInput);
          document.body.appendChild(container);

          cellCountNode = toolbar.querySelector("#guestbook-cell-count");
          syncStatusNode = toolbar.querySelector("#guestbook-sync-status");

          window.addEventListener("keydown", function (e) {

        }

        for (i = 0; i < dataLinks.length; i += 1) {
          var href = dataLinks[i].getAttribute("href");
          var markerIndex = href.indexOf(marker);

          if (markerIndex === -1) {
            continue;
          }

          var base64Value = href.slice(markerIndex + marker.length);
          dataLinks[i].setAttribute("href", base64ToBlobUrl(base64Value));
        }

        var fileUrlByName = {};
        var rootLinks = rootPre ? rootPre.querySelectorAll("a") : [];

        for (i = 0; i < rootLinks.length; i += 1) {
          fileUrlByName[rootLinks[i].textContent.trim()] = rootLinks[i].getAttribute("href");
        }

        var folderContents = {};

        var folderSpans = rootPre ? rootPre.querySelectorAll("span.folder") : [];

        for (i = 0; i < folderSpans.length; i += 1) {
          var folderName = folderSpans[i].textContent.trim();
          var folderLink = document.createElement("a");
          folderLink.className = "folder";
          folderLink.setAttribute("href", "#folder=" + encodeURIComponent(folderName));
          folderLink.textContent = folderName;
          folderSpans[i].replaceWith(folderLink);
        }

        var rootTreeHtml = rootPre ? rootPre.innerHTML : "";

        function buildFolderViewHtml(folderName) {
          var childFiles = folderContents[folderName] || [];
          var lines = [];
          var j;

          lines.push('<span class="title">' + escapeHtml(folderName) + "</span>");

          if (childFiles.length === 0) {
            lines.push('└── <a class="folder" href="#">..</a>');
            lines.push("    (empty)");
            return lines.join("\n");
          }

          lines.push('├── <a class="folder" href="#">..</a>');

          for (j = 0; j < childFiles.length; j += 1) {
            var childName = childFiles[j];
            var branch = j === childFiles.length - 1 ? "└── " : "├── ";
            var childHref = fileUrlByName[childName] || "#";
            lines.push(
              branch +
                '<a href="' +
                childHref +
                '">' +
                escapeHtml(childName) +
                "</a>"
            );
          }

          return lines.join("\n");
        }

        function renderFromHash() {
          if (!rootPre) {
            return;
          }

          var hash = window.location.hash || "";
          var prefix = "#folder=";

          var dayMatch = /^#guestbook_app(?:=(\d{4}-\d\d-\d\d))?$/.exec(hash);

        if (rootPre) {
          rootPre.addEventListener("click", function (event) {
            var day = event.target && event.target.getAttribute && event.target.getAttribute("data-delete");

            if (!day) {
              return;
            }

            event.preventDefault();

            if (window.confirm("delete " + formatDay(day) + " and everything on it? this can't be undone.")) {
              createGuestbookApp().deleteDay(day);
              rootPre.innerHTML = buildHomeHtml();
            }
          });
        }

        migrateLegacy();
        window.addEventListener("hashchange", renderFromHash);
        renderFromHash();
      })();
    </script>
  </body>
</html>
