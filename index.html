        function base64ToBlobUrl(base64Value) {

          function normalizeCellChar(value) {

            var worldY;

            if (comma <= 0 || comma >= key.length - 1) {

            worldX = parseInt(key.slice(0, comma), 10);
            worldY = parseInt(key.slice(comma + 1), 10);

            if (!isFinite(worldX) || !isFinite(worldY)) {

            return {
              worldX: worldX,
              worldY: worldY,

              snapshot.cells[key] = {
                ch: normalizeCellChar(currentValue),
                updatedAt: safeTime,
              };

              if (safeTime > snapshot.updatedAt) {
                snapshot.updatedAt = safeTime;

          function normalizeRemoteDocument(raw) {
            var output = { cells: {}, updatedAt: 0 };
            var key;

            if (!raw || typeof raw !== "object") {
              return output;
            }

            output.updatedAt = safeTimestamp(raw.updatedAt);

            if (!raw.cells || typeof raw.cells !== "object" || Array.isArray(raw.cells)) {
              return output;
            }

            for (key in raw.cells) {

              var item;
              var ch;
              var updatedAt;

              if (!Object.prototype.hasOwnProperty.call(raw.cells, key)) {
                continue;
              }

              parsedKey = parseWorldKey(key);

              if (!parsedKey) {
                continue;

              item = raw.cells[key];

              if (!item || typeof item !== "object") {
                continue;

              ch = normalizeCellChar(item.ch);
              updatedAt = safeTimestamp(item.updatedAt);

              output.cells[parsedKey.key] = {
                ch: ch,
                updatedAt: updatedAt,

                allKeys[key] = true;

            for (key in localSnapshot.cells) {

              var localCell = localSnapshot.cells[key];

              if (!chosen) {

              chosenTime = safeTimestamp(chosen.updatedAt);

          function applySnapshot(snapshot) {

              var incomingTime;
              var localTime;

              incoming = snapshot.cells[key];
              incomingTime = safeTimestamp(incoming.updatedAt);
              localTime = safeTimestamp(versionMap.get(key));

              if (incomingTime < localTime) {

              }

              versionMap.set(key, incomingTime);

              if (normalizeCellChar(incoming.ch) === " ") {
                cellMap.delete(key);
              } else {
                cellMap.set(key, normalizeCellChar(incoming.ch));

            if (remoteDocTime > 0) {
              versionMap.forEach(function (timestamp, localKey) {

                  !Object.prototype.hasOwnProperty.call(snapshot.cells, localKey) &&
                  safeTimestamp(timestamp) < remoteDocTime

                  versionMap.set(localKey, remoteDocTime);
                  cellMap.delete(localKey);
                }

            updateCellCount();

          // Write one character to the world map and schedule persistence.
          function setCell(worldX, worldY, value) {
            var key = mapKey(worldX, worldY);
            var normalized = normalizeCellChar(value);
            var previous = cellMap.has(key) ? cellMap.get(key) : " ";
            var now = Date.now();

            if (normalized === previous) {
              return;
            }

            if (normalized === " ") {
              cellMap.delete(key);
            } else {
              cellMap.set(key, normalized);

          function loadLegacyArray(parsedArray) {

            if (!Array.isArray(parsedArray)) {

              var item = parsedArray[idx];

              if (!Array.isArray(item) || item.length < 2) {

              parsedKey = parseWorldKey(item[0]);

              if (!parsedKey || typeof item[1] !== "string") {
                continue;
              }

              if (item[1].length === 1 && item[1] !== " ") {
                cellMap.set(parsedKey.key, item[1]);
                versionMap.set(parsedKey.key, safeTimestamp(item[2]));

            updateCellCount();

            var parsed;

          async function fetchRemoteSnapshot() {
            var response;
            var payload;

            response = await fetch(guestbookSharedEndpoint, {
              method: "GET",
              cache: "no-store",
            });

            if (!response.ok) {
              throw new Error("Remote read failed: " + response.status);
            }

            payload = await response.json();

            return {
              etag: response.headers.get("etag"),
              snapshot: normalizeRemoteDocument(payload),

          async function writeRemoteSnapshot(snapshot, etag) {
            var response;
            var headers = {
              "Content-Type": "application/json",

              headers["If-Match"] = etag;

            response = await fetch(guestbookSharedEndpoint, {
              method: "PUT",
              headers: headers,
              body: JSON.stringify(snapshot),

              conflictError.code = 412;
              throw conflictError;
            }

            if (!response.ok) {
              throw new Error("Remote write failed: " + response.status);
            }

              return;

            if (remoteSaveTimer) {

            remoteSaveTimer = window.setTimeout(function () {
              remoteSaveTimer = 0;

            }, Math.max(150, delay));

          async function syncRemote(force) {
            var now = Date.now();
            var attempts = 0;
            var writeReadyAt;

            if (!guestbookSharedEndpoint) {
              setSyncStatus("local only");
              return;
            }

            if (remoteSyncInFlight) {
              remoteSyncQueued = true;
              return;
            }

            writeReadyAt = Math.max(0, nextAllowedRemoteWriteAt - now);

            if (!force && writeReadyAt > 0) {
              scheduleRemoteSync(writeReadyAt);
              return;

            remoteSyncInFlight = true;
            setSyncStatus("syncing");

            while (attempts < 3) {

              var localSnapshot;
              var mergedSnapshot;

                remoteSyncInFlight = false;

                if (remoteSyncQueued) {

                  scheduleRemoteSync(remoteMinWriteIntervalMs);
                }

                return;
              } catch (error) {
                if (!error || error.code !== 412) {
                  setSyncStatus("local only");
                  nextAllowedRemoteWriteAt = Date.now() + remoteMinWriteIntervalMs;
                  remoteSyncInFlight = false;

                  if (remoteSyncQueued) {
                    remoteSyncQueued = false;
                    scheduleRemoteSync(remoteMinWriteIntervalMs);
                  }

                  return;
                }
              }
            }

            setSyncStatus("sync conflict");
            remoteSyncInFlight = false;
            scheduleRemoteSync(remoteMinWriteIntervalMs);
          }

          async function pullRemoteSnapshot() {

            while (x > guestbookStartPoint.x && q.length < 12) {
              c = cellAt(x - 1, cursorY);

              if (/^[a-z0-9_]$/i.test(c)) {
                q = c + q;
                x -= 1;
              } else {
                break;
              }
            }

            if (x <= guestbookStartPoint.x || cellAt(x - 1, cursorY) !== ":") {
              picker.dismissed = false;
              return;
            }

            if (x - 1 > guestbookStartPoint.x && /^[a-z0-9_]$/i.test(cellAt(x - 2, cursorY))) {
              return;
            }

            if (picker.dismissed) {
              return;
            }

            picker.colonX = x - 1;
            q = q.toLowerCase();
            picker.matches = Object.keys(emojis)
              .filter(function (n) { return n.indexOf(q) === 0; })
              .concat(Object.keys(emojis).filter(function (n) { return q && n.indexOf(q) > 0; }))
              .slice(0, 6);
            picker.sel = 0;
            renderPicker();
          }

          // Typing a full ":name:" turns it into the emoji.
          function finishShortcode() {
            var x = cursorX;
            var q = "";

            while (x > guestbookStartPoint.x && /^[a-z0-9_]$/i.test(cellAt(x - 1, cursorY))) {
              q = cellAt(x - 1, cursorY) + q;
              x -= 1;
            }

            if (!q || cellAt(x - 1, cursorY) !== ":" || !emojis[q.toLowerCase()]) {
              return false;
            }

            picker.colonX = x - 1;
            picker.matches = [q.toLowerCase()];
            picker.sel = 0;
            pickEmoji();
            return true;
          }

          function pickEmoji() {
            var x;
            var emoji = emojis[picker.matches[picker.sel]];

            if (!emoji) {
              return;
            }

            for (x = picker.colonX; x < cursorX; x += 1) {
              setCell(x, cursorY, "");
            }

            cursorX = picker.colonX;
            setCell(cursorX, cursorY, emoji);
            cursorX += 2;
            hidePicker();
          }

          function clientToWorld(clientX, clientY) {
            var rect = canvas.getBoundingClientRect();
            var screenX = clientX - rect.left;
            var screenY = clientY - rect.top;

            var wy = Math.floor((screenY + offsetY) / cellHeight);

            return {
              worldX: Math.floor((screenX + offsetX) / (cellWidth * rowScale(wy))),
              worldY: wy,
            };
          }

          // Pasted images: downscaled, kept in localStorage, drawn at their cell.
          function saveImages() {
            try {
              localStorage.setItem(
                imagesKey,
                JSON.stringify(images.map(function (it) { return { x: it.x, y: it.y, src: it.src }; }))
              );
            } catch (e) {}
          }

          function addImage(x, y, src, persist) {
            var img = new Image();
            var item = { x: x, y: y, src: src, img: img };

            img.onload = function () { item.ready = true; };
            img.src = src;
            images.push(item);

            if (persist) {
              saveImages();
            }
          }

          function loadImages() {
            try {
              JSON.parse(localStorage.getItem(imagesKey) || "[]").forEach(function (it) {
                addImage(it.x, it.y, it.src, false);
              });
            } catch (e) {}
          }

          function removeImageAtCursor() {
            var before = images.length;

            images = images.filter(function (it) { return it.x !== cursorX || it.y !== cursorY; });

            if (images.length !== before) {
              saveImages();
              return true;
            }

            return false;
          }

          function onPaste(event) {
            var items = (event.clipboardData && event.clipboardData.items) || [];
            var k;

            if (!guestbookApp || !guestbookApp.active) {
              return;
            }

            for (k = 0; k < items.length; k += 1) {
              if (items[k].type.indexOf("image/") === 0) {
                var file = items[k].getAsFile();
                var reader = new FileReader();
                var px = cursorX;
                var py = cursorY;

                event.preventDefault();
                reader.onload = function () {
                  var src = new Image();

                  src.onload = function () {
                    var scale = Math.min(1, 360 / src.width);
                    var c = document.createElement("canvas");

                    c.width = Math.max(1, Math.round(src.width * scale));
                    c.height = Math.max(1, Math.round(src.height * scale));
                    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
                    addImage(px, py, c.toDataURL("image/jpeg", 0.85), true);
                  };
                  src.src = reader.result;
                };
                reader.readAsDataURL(file);
                return;
              }
            }
          }

          function moveCursor(dx, dy) {
            cursorX += dx;
            cursorY += dy;

            if (dy !== 0) {
              hidePicker();
            }
          }

          function insertTextAtCursor(text) {
            var idx;

            if (!cursorActive) {
              return;
            }

            if (needStamp) {
              var now = new Date();
              var pad = function (n) { return (n < 10 ? "0" : "") + n; };
              var stamp =
                now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) +
                " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + " ";

              needStamp = false;
              insertTextAtCursor(stamp);
            }

            var chars = Array.from(text);

            for (idx = 0; idx < chars.length; idx += 1) {
              var ch = chars[idx];

              if (ch === "\r") {
                continue;
              }

              if (ch === "\n") {
                cursorX = guestbookStartPoint.x;
                cursorY += 1;
                continue;
              }

              if (ch === ":" && finishShortcode()) {
                continue;
              }

              setCell(cursorX, cursorY, ch);
              moveCursor(ch.length > 1 ? 2 : 1, 0);
            }

            updatePicker();
          }

          // Trackpad/mouse-wheel panning updates the camera offset.
          function onWheel(event) {
            event.preventDefault();
            offsetX += event.deltaX;
            offsetY += event.deltaY;
          }

          // Start drag-panning with mouse or touch.
          function onPointerDown(event) {
            if (event.pointerType === "mouse" && event.button !== 0) {
              return;
            }

            dragging = true;
            moved = false;
            activePointerId = event.pointerId;
            lastDragX = event.clientX;
            lastDragY = event.clientY;
            canvas.classList.add("dragging");
            if (typeof canvas.setPointerCapture === "function") {
              canvas.setPointerCapture(event.pointerId);
            }
            canvas.focus();
            mobileInput.focus();
            event.preventDefault();
          }

          // Continue drag-panning while pointer is held.
          function onPointerMove(event) {
            var dx;
            var dy;

            if (!dragging || activePointerId !== event.pointerId) {
              return;
            }

            dx = event.clientX - lastDragX;
            dy = event.clientY - lastDragY;

            if (dx !== 0 || dy !== 0) {
              moved = true;
            }

            offsetX -= dx;
            offsetY -= dy;
            lastDragX = event.clientX;
            lastDragY = event.clientY;
            event.preventDefault();
          }

          // End dragging; if no movement happened, treat it as click/tap to place cursor.
          function onPointerUp(event) {
            var hit;

            if (!dragging || activePointerId !== event.pointerId) {
              return;
            }

            dragging = false;
            activePointerId = null;
            canvas.classList.remove("dragging");

            if (!moved) {
              hit = clientToWorld(event.clientX, event.clientY);
              cursorX = hit.worldX;
              cursorY = hit.worldY;
              cursorActive = true;
              needStamp = true;
              hidePicker();
              canvas.focus();
              mobileInput.focus();
            }

            event.preventDefault();
          }

          function onPointerCancel(event) {
            if (activePointerId !== event.pointerId) {
              return;
            }

            dragging = false;
            activePointerId = null;
            canvas.classList.remove("dragging");
          }

          // Keyboard editing writes directly into world cells and moves cursor.
          function onKeyDown(event) {
            if (!cursorActive) {
              return;
            }

            if (event.metaKey || event.ctrlKey) {
              return;
            }

            if (picker.matches.length > 0) {
              if (event.key === "Enter" || event.key === "Tab") {
                event.preventDefault();
                pickEmoji();
                return;
              }

              if (event.key === "Escape") {
                event.preventDefault();
                picker.dismissed = true;
                hidePicker();
                return;
              }

              if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                event.preventDefault();
                picker.sel = (picker.sel + (event.key === "ArrowDown" ? 1 : picker.matches.length - 1)) % picker.matches.length;
                renderPicker();
                return;
              }
            }

            if ((event.key === "Backspace" || event.key === "Delete") && removeImageAtCursor()) {
              event.preventDefault();
              return;
            }

            if (event.key === "Backspace") {
              event.preventDefault();
              moveCursor(-1, 0);
              setCell(cursorX, cursorY, "");
              updatePicker();
              return;
            }

            if (event.key === "Delete") {
              event.preventDefault();
              setCell(cursorX, cursorY, "");
              return;
            }

            if (event.key === "Enter") {
              event.preventDefault();
              cursorX = guestbookStartPoint.x;
              cursorY += 1;
              hidePicker();
              return;
            }

            if (event.key === "ArrowLeft") {
              event.preventDefault();
              moveCursor(-1, 0);
              return;
            }

            if (event.key === "ArrowRight") {
              event.preventDefault();
              moveCursor(1, 0);
              return;
            }

            if (event.key === "ArrowUp") {
              event.preventDefault();
              moveCursor(0, -1);
              return;
            }

            if (event.key === "ArrowDown") {
              event.preventDefault();
              moveCursor(0, 1);
              return;
            }

            if (event.key === "Tab") {
              event.preventDefault();
              moveCursor(2, 0);
              return;
            }

            if (event.key.length === 1 && !event.altKey) {
              event.preventDefault();
              insertTextAtCursor(event.key);
            }
          }

          function onMobileInput() {
            var value = mobileInput.value;

            if (!value) {
              return;
            }

            insertTextAtCursor(value);
            mobileInput.value = "";
          }

          // Keep the canvas resolution in sync with window size and device pixel ratio.
          function resizeCanvas() {
            var rect;
            var m;

            dpr = window.devicePixelRatio || 1;
            rect = canvas.getBoundingClientRect();
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.font = "16px monospace";
            ctx.textBaseline = "top";

            m = ctx.measureText("M");
            cellWidth = Math.max(8, Math.ceil(m.width));
            cellHeight = 20;
            baseline = 2;
          }

          // Render loop: clear, draw only visible cells, then draw blinking cursor.
          function render() {
            var width = canvas.clientWidth;
            var height = canvas.clientHeight;
            var minX = Math.floor(offsetX / cellWidth) - 1;
            var maxX = Math.floor((offsetX + width) / cellWidth) + 1;
            var minY = Math.floor(offsetY / cellHeight) - 1;
            var maxY = Math.floor((offsetY + height) / cellHeight) + 1;
            var now = Date.now();

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#000000";

            images.forEach(function (it) {
              if (it.ready) {
                ctx.drawImage(it.img, it.x * cellWidth - offsetX, it.y * cellHeight - offsetY);
              }
            });

            var rows = {};

            cellMap.forEach(function (value, key) {
              var comma = key.indexOf(",");
              var worldX = parseInt(key.slice(0, comma), 10);
              var worldY = parseInt(key.slice(comma + 1), 10);

              if (comma <= 0 || !isFinite(worldX) || !isFinite(worldY)) {
                return;
              }

              if (worldY < minY || worldY > maxY) {
                return;
              }

              (rows[worldY] = rows[worldY] || []).push([worldX, value]);
            });

            Object.keys(rows).forEach(function (rowKey) {
              var y = parseInt(rowKey, 10);
              var cells = rows[rowKey].sort(function (a, b) { return a[0] - b[0]; });
              var head = headInfo(y);
              var k = head.k;
              var bold = false;
              var n;

              for (n = 0; n < cells.length; n += 1) {
                var x = cells[n][0];
                var ch = cells[n][1];
                var next = cells[n + 1];
                var marker = false;

                if (ch === "*" && next && next[0] === x + 1 && next[1] === "*") {
                  if (bold || cells.slice(n + 2).some(function (c, i, a) {
                    return c[1] === "*" && a[i + 1] && a[i + 1][0] === c[0] + 1 && a[i + 1][1] === "*";
                  })) {
                    marker = true;
                  }
                }

                var isHash = k > 1 && x >= head.from && x <= head.to;
                var drawX = x * cellWidth * k - offsetX;
                var drawY = y * cellHeight - offsetY;

                if (x * k < minX - 1 || x * k > maxX) {
                  continue;
                }

                if (marker) {
                  ctx.fillStyle = "#bbbbbb";
                  ctx.font = "bold 16px monospace";
                  ctx.fillText("*", drawX, drawY + baseline);
                  ctx.fillText("*", drawX + cellWidth * k, drawY + baseline);
                  bold = !bold;
                  n += 1;
                  continue;
                }

                ctx.fillStyle = isHash ? "#bbbbbb" : "#000000";
                ctx.font = (k > 1 ? "bold " + Math.round(16 * k) : bold ? "bold 16" : "16") + "px monospace";
                ctx.fillText(ch, drawX, drawY + baseline - (k > 1 ? 1 : 0));
              }
            });

            ctx.fillStyle = "#000000";
            ctx.font = "16px monospace";

            if (cursorActive && Math.floor(now / 450) % 2 === 0) {
              var cursorDrawX = cursorX * cellWidth * rowScale(cursorY) - offsetX;
              var cursorDrawY = cursorY * cellHeight - offsetY;

              if (
                cursorDrawX >= -cellWidth &&
                cursorDrawX <= width + cellWidth &&
                cursorDrawY >= -cellHeight &&
                cursorDrawY <= height + cellHeight
              ) {
                ctx.fillRect(cursorDrawX, cursorDrawY + 2, 2, cellHeight - 4);
              }
            }

            if (guestbookApp.active) {
              frameId = window.requestAnimationFrame(render);
            } else {
              frameId = 0;
            }
          }

          container.id = "guestbook-canvas-app";

          toolbar.id = "guestbook-toolbar";
          toolbar.innerHTML =
            '<a href="#">..</a> | drag/wheel: pan | click/tap: cursor | type: write | cells: ' +
            "<span id=\"guestbook-cell-count\">0</span>" +
            " | " +
            "<span id=\"guestbook-sync-status\">starting</span>";

          canvas.id = "guestbook-canvas";
          canvas.setAttribute("tabindex", "0");

          mobileInput.setAttribute("autocomplete", "off");
          mobileInput.setAttribute("autocapitalize", "off");
          mobileInput.setAttribute("autocorrect", "off");
          mobileInput.setAttribute("spellcheck", "false");
          mobileInput.style.position = "fixed";
          mobileInput.style.left = "-9999px";
          mobileInput.style.top = "0";
          mobileInput.style.width = "1px";
          mobileInput.style.height = "1px";
          mobileInput.style.opacity = "0";
          mobileInput.style.pointerEvents = "none";
          mobileInput.style.zIndex = "-1";

          container.appendChild(toolbar);
          container.appendChild(canvas);
          container.appendChild(mobileInput);
          document.body.appendChild(container);
          document.body.appendChild(pickerNode);

          cellCountNode = toolbar.querySelector("#guestbook-cell-count");
          syncStatusNode = toolbar.querySelector("#guestbook-sync-status");

          ctx = canvas.getContext("2d");

          loadFromStorage();
          loadImages();

          window.addEventListener("paste", onPaste);
          canvas.addEventListener("wheel", onWheel, { passive: false });
          canvas.addEventListener("pointerdown", onPointerDown);
          window.addEventListener("pointermove", onPointerMove);
          window.addEventListener("pointerup", onPointerUp);
          window.addEventListener("pointercancel", onPointerCancel);
          canvas.addEventListener("keydown", onKeyDown);
          mobileInput.addEventListener("keydown", onKeyDown);
          mobileInput.addEventListener("input", onMobileInput);
          window.addEventListener("resize", resizeCanvas);

          toolbar.addEventListener("click", function (event) {
            var target = event.target;

            if (target && target.tagName === "A") {
              event.preventDefault();
              window.location.hash = "";
            }
          });

          guestbookApp = {
            container: container,
            canvas: canvas,
            active: false,
            start: function () {
              this.active = true;
              container.style.display = "block";
              resizeCanvas();
              centerOnStartPoint();
              canvas.focus();
              mobileInput.focus();
              updateCellCount();

              if (!guestbookSharedEndpoint) {
                setSyncStatus("local only");
              } else {
                setSyncStatus("loading");
                pullRemoteSnapshot().then(function () {
                  if (guestbookApp && guestbookApp.active) {
                    scheduleRemotePolling();
                  }
                });
              }

              if (!frameId) {
                frameId = window.requestAnimationFrame(render);
              }
            },
            stop: function () {
              this.active = false;
              container.style.display = "none";

              if (localSaveTimer) {
                window.clearTimeout(localSaveTimer);
                localSaveTimer = 0;
              }

              if (remoteSaveTimer) {
                window.clearTimeout(remoteSaveTimer);
                remoteSaveTimer = 0;
              }

              if (remotePollTimer) {
                window.clearTimeout(remotePollTimer);
                remotePollTimer = 0;
              }

              saveToStorage();

              if (guestbookSharedEndpoint) {
                syncRemote(true);
              }
            },
            getMapSize: function () {
              return cellMap.size;
            },
          };

          return guestbookApp;
        }

        for (i = 0; i < dataLinks.length; i += 1) {
          var href = dataLinks[i].getAttribute("href");
          var markerIndex = href.indexOf(marker);

          if (markerIndex === -1) {
            continue;
          }

          var base64Value = href.slice(markerIndex + marker.length);
          dataLinks[i].setAttribute("href", base64ToBlobUrl(base64Value));
        }

        var fileUrlByName = {};
        var rootLinks = rootPre ? rootPre.querySelectorAll("a") : [];

        for (i = 0; i < rootLinks.length; i += 1) {
          fileUrlByName[rootLinks[i].textContent.trim()] = rootLinks[i].getAttribute("href");
        }

        var folderContents = {};

        var folderSpans = rootPre ? rootPre.querySelectorAll("span.folder") : [];

        for (i = 0; i < folderSpans.length; i += 1) {
          var folderName = folderSpans[i].textContent.trim();
          var folderLink = document.createElement("a");
          folderLink.className = "folder";
          folderLink.setAttribute("href", "#folder=" + encodeURIComponent(folderName));
          folderLink.textContent = folderName;
          folderSpans[i].replaceWith(folderLink);
        }

        var rootTreeHtml = rootPre ? rootPre.innerHTML : "";

        function buildFolderViewHtml(folderName) {
          var childFiles = folderContents[folderName] || [];
          var lines = [];
          var j;

          lines.push('<span class="title">' + escapeHtml(folderName) + "</span>");

          if (childFiles.length === 0) {
            lines.push('└── <a class="folder" href="#">..</a>');
            lines.push("    (empty)");
            return lines.join("\n");
          }

          lines.push('├── <a class="folder" href="#">..</a>');

          for (j = 0; j < childFiles.length; j += 1) {
            var childName = childFiles[j];
            var branch = j === childFiles.length - 1 ? "└── " : "├── ";
            var childHref = fileUrlByName[childName] || "#";
            lines.push(
              branch +
                '<a href="' +
                childHref +
                '">' +
                escapeHtml(childName) +
                "</a>"
            );
          }

          return lines.join("\n");
        }

        function renderFromHash() {
          if (!rootPre) {
            return;
          }

          var hash = window.location.hash || "";
          var prefix = "#folder=";

          if (hash === guestbookHash) {
            rootPre.style.display = "none";
            createGuestbookApp().start();
            document.title = "free text editor";
            return;
          }

          if (guestbookApp) {
            guestbookApp.stop();
          }

          rootPre.style.display = "block";

          if (hash.indexOf(prefix) === 0) {
            var folderName = decodeURIComponent(hash.slice(prefix.length));

            if (Object.prototype.hasOwnProperty.call(folderContents, folderName)) {
              rootPre.innerHTML = buildFolderViewHtml(folderName);
              document.title = folderName;
              return;
            }
          }

          rootPre.innerHTML = rootTreeHtml;
          document.title = "pranav ajay";
        }

        window.addEventListener("hashchange", renderFromHash);
        renderFromHash();
      })();
    </script>
  </body>
</html>
